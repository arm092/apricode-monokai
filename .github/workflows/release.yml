name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish stable plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch tagged sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify release
        run: ./gradlew check verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin buildPlugin

      - name: Upload GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/distributions/*.zip --clobber

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin
