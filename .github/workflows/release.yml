name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing GitHub release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}

jobs:
  publish:
    name: Publish stable plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch tagged sources
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ startsWith(env.RELEASE_TAG, 'v2.') && '21' || '25' }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify release
        run: ./gradlew check verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin buildPlugin

      - name: Upload GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/distributions/*.zip --clobber

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin
