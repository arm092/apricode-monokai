name: Build

on:
  push:
    branches:
      - main
      - "tasks/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Fetch sources
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate project and build plugin
        run: ./gradlew check verifyPluginProjectConfiguration verifyPluginStructure buildPlugin

      - name: Verify IDE compatibility
        run: ./gradlew verifyPlugin

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v7
        with:
          name: apricode-monokai-${{ github.sha }}
          path: build/distributions/*.zip

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-${{ github.sha }}
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
